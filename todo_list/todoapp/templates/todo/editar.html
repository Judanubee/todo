{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Tarea</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
</head>
<body class="azul_fondo">

    <div class="container" style="margin-top: 50px;">
        <div class="row">
            <div class="col s12 m8 l6 offset-m2 offset-l3">
                <div class="card azul_portada z-depth-3" style="border-radius: 8px; padding: 10px;">
                    <div class="card-content">
                        <span class="card-title center-align claro_text"><strong> Editar Tarea</strong></span>
                        
                        <form method="POST">
                            {% csrf_token %}
                            
                            
                            <div class="input-field">
                                <input type="text" id="titulo" name="titulo" value="{{ form.instance.titulo }}" class="white-text" required>
                                <label for="titulo" class="active claro_text">Título de la tarea</label>
                            </div>

                            
                            <div class="input-field">
                                <textarea id="descripcion" name="descripcion" class="materialize-textarea white-text">{{ form.instance.descripcion }}</textarea>
                                <label for="descripcion" class="active claro_text">Descripción</label>
                            </div>

                            <p class="checkbox-container">
                                <label>
                                    <input type="checkbox" name="complete" {% if form.instance.complete %}checked{% endif %}>
                                    <span class="claro_text">Marcar como completada</span>
                                </label>
                            </p>

                            <div class="center-align mt-4" style="display: flex; gap: 10px; justify-content: center;">
                                <button type="submit" class="btn-small azul_fondo waves-effect waves-light" style="flex: 1;">
                                    Guardar Cambios
                                </button>
                                <a href="{% url 'todoapp' %}" class="btn-flat red-text style="flex: 1; text-transform: none;">
                                    Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
